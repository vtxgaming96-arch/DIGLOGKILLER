name: VTX Patcher Bot

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      # ============================================
      # 1. CHECKOUT
      # ============================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================
      # 2. SETUP PYTHON
      # ============================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============================================
      # 3. SETUP JAVA
      # ============================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ============================================
      # 4. INSTALL SYSTEM TOOLS
      # ============================================
      - name: Install System Tools
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            zipalign \
            apksigner \
            unzip \
            wget
          echo "✅ Tools installed"
          which apksigner || echo "❌ apksigner missing"
          which zipalign || echo "❌ zipalign missing"

      # ============================================
      # 5. DOWNLOAD UBER APK SIGNER
      # ============================================
      - name: Download Uber APK Signer
        run: |
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar \
            -O /tmp/uber-apk-signer.jar
          ls -lh /tmp/uber-apk-signer.jar
          echo "✅ uber-apk-signer downloaded"

      # ============================================
      # 6. INSTALL PYTHON DEPENDENCIES
      # ============================================
      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip list | grep telegram

      # ============================================
      # 7. RUN BOT
      # ============================================
      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          echo "========================================"
          echo "Starting VTX PATCHER Bot..."
          echo "========================================"
          python bot.py
